version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKER_USER:-yourdockerhubusername}/neurosight-backend:latest
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKER_USER:-yourdockerhubusername}/neurosight-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
